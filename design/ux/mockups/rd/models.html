<!doctype html>
<html><head><meta charset="utf-8"><title>MODELS</title>
<link rel="stylesheet" href="rd.css">
<style>
.grid2 { display: grid; grid-template-columns: 640px minmax(0, 1fr); gap: 14px; flex: 1; min-height: 0; }
.tree { padding-bottom: 12px; display: flex; flex-direction: column; }
.base { margin: 10px 14px 0; border: 1px solid var(--line); border-radius: 9px; background: var(--bg-2); padding: 8px 0 6px; }
.base .bh { display: flex; align-items: center; gap: 9px; padding: 2px 14px 6px; font-size: 13px; color: var(--text-2); }
.base .bh b { color: #fff; font-size: 14px; }
.node { display: grid; grid-template-columns: 18px 128px 150px minmax(0,1fr); gap: 10px; align-items: center; padding: 6px 14px; font-size: 13.5px; position: relative; }
.node .ln { width: 14px; height: 100%; border-left: 2px solid var(--line-2); margin-left: 6px; position: relative; align-self: stretch; }
.node .ln::after { content: ''; position: absolute; left: -6px; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: var(--panel-3); border: 2px solid #8da2bd; transform: translateY(-50%); }
.node.mini .ln::after { width: 7px; height: 7px; left: -5px; }
.node.sel { background: rgba(58,138,224,.12); box-shadow: inset 3px 0 0 var(--you); }
.node .nm { color: #fff; font-weight: 600; white-space: nowrap; }
.node.mini .nm { font-weight: 500; color: var(--text); padding-left: 10px; }
.node .cb { position: relative; height: 8px; background: var(--panel); border-radius: 3px; }
.node .cb i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cap); border-radius: 3px; }
.node .cb .tk { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #8da2bd; }
.node .roles { display: flex; gap: 5px; flex-wrap: nowrap; overflow: hidden; }
.stw { font-size: 11.5px; font-weight: 650; padding: 1px 7px; border-radius: 9px; white-space: nowrap; }
.stw.use { color: var(--good); background: var(--good-bg); }
.stw.ready { color: #cfe3ff; background: rgba(58,138,224,.15); }
.stw.test { color: var(--warn); background: var(--warn-bg); }
.stw.ret { color: var(--text-3); background: var(--panel-3); }
.rc { font-size: 11.5px; padding: 0 6px; border-radius: 5px; border: 1px solid #22504b; color: var(--ai); white-space: nowrap; }
.rc.p { border-color: #6b5a1a; color: #e6cf7a; }
.rc.w { border-color: #36507a; color: #cfe3ff; }
.fold { font-size: 12.5px; color: var(--text-3); padding: 4px 14px 2px 44px; display: flex; align-items: center; gap: 6px; }
.mcard { display: flex; flex-direction: column; }
.mh { display: flex; align-items: center; gap: 12px; padding: 14px 18px 4px; }
.mh .t { font-size: 22px; font-weight: 650; color: #fff; }
.facts { display: flex; gap: 18px; padding: 2px 18px 8px; font-size: 13px; color: var(--text-2); }
.facts b { color: #fff; font-weight: 600; }
.cols { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 18px; padding: 0 18px; flex: 1; min-height: 0; }
.ladder { display: flex; flex-direction: column; gap: 0; border-left: 1px solid var(--line); padding-left: 18px; }
.rung { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; font-size: 13.5px; position: relative; }
.rung .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--bg-2); }
.rung.met .dot { background: var(--good); border-color: var(--good); }
.rung.next .dot { border-color: var(--cap); }
.rung .d { font-size: 12px; color: var(--text-3); }
.rung.met .nm { color: #fff; }
.rung .nm { color: var(--text-2); }
.l2 { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 18px 16px; border-top: 1px solid var(--line); margin-top: 10px; align-items: center; }
.ovr { display: flex; align-items: center; gap: 12px; padding: 8px 12px; margin: 4px 0 6px; border-radius: 9px; background: rgba(155,107,224,.08); border: 1px solid rgba(155,107,224,.3); font-size: 13.5px; }
.mcard .sk { padding: 12px 0; } .mcard .skr { height: 22px; }
.capr { border-bottom: 1px solid var(--line); margin-bottom: 4px; } .capr .skn { font-weight: 650; }
.node { grid-template-columns: 18px 118px 110px minmax(0,1fr) !important; padding: 9px 14px !important; }
.rax { position: relative; height: 34px; border-top: 1px solid var(--line-2); }
.rax span { position: absolute; top: 4px; transform: translateX(-50%); font-size: 11.5px; color: var(--text-3); white-space: nowrap; padding-top: 6px; }
.rax span::before { content: ""; position: absolute; left: 50%; top: -5px; width: 1px; height: 8px; background: #5d6f88; }
.rax span.met { color: var(--good); }
</style></head>
<body data-tab="models">
<!--ICONS-->
<div class="app"><div class="main" id="main"></div></div>
<script src="data.js"></script>
<script src="comp.js"></script>
<script src="d2.js"></script>
<script src="shell.js"></script>
<script src="models.js"></script>
</body></html>
