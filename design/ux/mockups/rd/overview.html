<!doctype html>
<html><head><meta charset="utf-8"><title>Overview</title>
<link rel="stylesheet" href="rd.css">
<style>
/* hub (L1 #1) */
.hub { position: relative; height: 382px; }
.hub svg.edges { position: absolute; inset: 0; pointer-events: none; }
.hn { position: absolute; width: 190px; height: 92px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line-2); padding: 11px 13px; display: flex; flex-direction: column; gap: 6px; }
.hn .h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.hn .h .go { margin-left: auto; color: var(--text-3); }
.hn .vd { font-size: 16.5px; font-weight: 650; color: #fff; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.hn .vd .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.hn.warn { border-color: rgba(233,180,76,.55); } .hn.warn .dot { background: var(--warn); }
.hn.good .dot { background: var(--good); } .hn.info .dot { background: #8fb8ea; }
.hn.side { background: var(--panel); border-style: dashed; }
.el { position: absolute; font-size: 12px; color: var(--text-3); white-space: nowrap; transform: translateX(-50%); background: var(--panel); padding: 0 6px; }
.el.ai { color: var(--ai); }

/* race (L1 #2) */
.race { padding: 0 0 14px; }
.lanes { position: relative; margin: 8px 24px 0 24px; }
.lane { display: grid; grid-template-columns: 190px minmax(0,1fr) 210px; gap: 18px; align-items: center; height: 68px; border-bottom: 1px solid var(--line); }
.lane:last-of-type { border-bottom: 0; }
.lane .ln { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 650; color: #fff; }
.lane .ln .fl { font-size: 11px; font-weight: 650; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; color: var(--text-2); border: 1px solid var(--line-2); }
.lane .ln .fl.cn { color: #f2a6c8; border-color: rgba(224,90,156,.5); }
.lane .tr { position: relative; height: 100%; }
.lane .tr .base { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--panel-3); transform: translateY(-1px); }
.lane .tr .rg { position: absolute; top: calc(50% - 5px); height: 10px; border-radius: 5px; opacity: .38; }
.lane .tr .dt { position: absolute; top: calc(50% - 13px); width: 26px; height: 26px; border-radius: 50%; transform: translateX(-13px); display: grid; place-items: center; font: 700 10.5px var(--sans); color: #1a0f05; box-shadow: 0 0 0 3px var(--panel); }
.lane .lval { text-align: right; }
.lane .lval b { font: 650 19px var(--mono); }
.lane .lval .w2 { font-size: 13px; color: var(--text-2); margin-left: 4px; }
.lane .lval .rg2 { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.ahead { color: var(--bad); } .behind { color: var(--good); }
.youline { position: absolute; top: -26px; bottom: -34px; width: 2px; background: var(--you); }
.youtag { position: absolute; bottom: -40px; transform: translateX(-50%); font: 700 12px var(--sans); color: #fff; background: #1f5fae; border: 1px solid var(--you); padding: 2px 12px; border-radius: 10px; }
.zone { position: absolute; top: -26px; bottom: -8px; background: rgba(239,107,107,.05); }
.axl { position: absolute; white-space: nowrap; bottom: -30px; transform: translateX(-50%); font: 11.5px var(--mono); color: var(--text-3); }
.axg { position: absolute; top: -8px; bottom: -8px; width: 1px; background: rgba(51,67,90,.55); }
.zl { position: absolute; top: -26px; font-size: 12.5px; font-weight: 600; }
</style></head>
<body data-tab="overview">
<!--ICONS-->
<div class="app"><div class="main" id="main"></div></div>
<script src="data.js"></script>
<script src="shell.js"></script>
<script src="overview-tip.js"></script>
<script src="overview.js"></script>
</body></html>
