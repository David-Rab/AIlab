<!doctype html>
<html><head><meta charset="utf-8"><title>LAB › Hiring &amp; teams</title>
<link rel="stylesheet" href="rd.css">
<style>
.main { gap: 14px; }
.grid { display: grid; grid-template-columns: minmax(0,1fr) 560px; gap: 14px; flex: 1; min-height: 0; }
.rcol { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.th, .tr { display: grid; grid-template-columns: 210px minmax(0,1fr) 150px 110px 230px; gap: 18px; align-items: center; padding: 0 20px; }
.th { padding-top: 14px; padding-bottom: 8px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); font-weight: 650; border-bottom: 1px solid var(--line); }
.tr { height: 112px; border-bottom: 1px solid var(--line); }
.band { display: flex; align-items: center; gap: 6px; padding: 10px 20px 4px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.rn { display: flex; align-items: center; gap: 10px; }
.rn .ri { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--panel-3); color: var(--text-2); }
.rn b { font-size: 15px; color: #fff; display: block; }
.rn span { font-size: 12.5px; color: var(--text-3); }
.tiles { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.tile { width: 40px; height: 34px; border-radius: 6px; background: #2c3a4d; box-shadow: inset 0 0 0 1px #3d5068; display: grid; place-items: end center; padding-bottom: 4px; position: relative; overflow: hidden; }
.tile .q { display: flex; gap: 2px; } .tile .q i { width: 5px; height: 5px; border-radius: 50%; background: #56677e; } .tile .q i.on { background: #d9c27a; }
.tile.fill { background: transparent; box-shadow: inset 0 0 0 1px #6f8fb5; border: 0; }
.tile.fill { box-shadow: inset 0 0 0 1px #8fb0d6; background: repeating-linear-gradient(135deg, rgba(111,143,181,.18) 0 4px, transparent 4px 8px); }
.tile.fill::before { content: ''; position: absolute; left: 0; bottom: 0; top: 0; width: var(--f); background: #4f6d8f; }
.tile.goal { background: transparent; box-shadow: none; border: 1px dashed var(--line-2); }
.tcap { font-size: 12px; color: var(--text-3); margin-left: 6px; white-space: nowrap; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.step span { padding: 3px 10px; font: 600 14px var(--mono); color: #fff; }
.step .b { color: var(--text-2); background: var(--panel-2); font-family: var(--sans); }
.pay { font: 600 14px var(--mono); color: #fff; }
.pay .u { font: 500 12px var(--sans); color: var(--text-3); }
.buys { font-size: 13px; color: var(--text-2); line-height: 1.4; }
.buys b { color: var(--good); font-family: var(--mono); }
.offer { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); }
.offer .oi { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--panel-3); color: var(--text-2); }
.offer b { color: #fff; font-size: 14px; }
.offer .s { font-size: 12.5px; color: var(--text-3); }
.leave { font: 600 12px var(--mono); }
.pbar { display: flex; gap: 2px; height: 14px; margin: 12px 18px 6px; }
.pbar i { height: 100%; } .pbar i:first-child { border-radius: 4px 0 0 4px; } .pbar i:last-child { border-radius: 0 4px 4px 0; }
.pl { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 18px; font-size: 12px; color: var(--text-2); }
.pl i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 10px 12px; padding: 12px 18px; font-size: 13.5px; border-top: 1px solid var(--line); align-items: center; }
.kv .v { font: 600 14px var(--mono); color: #fff; text-align: right; }
.mbar { position: relative; height: 8px; width: 160px; border-radius: 4px; background: var(--bg-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.mbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: #6f8fb5; }
</style></head>
<body data-tab="lab">
<!--ICONS-->
<div class="app"><div class="main" id="main"></div></div>
<script src="data.js"></script>
<script src="comp.js"></script>
<script src="shell.js"></script>
<script src="lab-hiring.js"></script>
</body></html>
