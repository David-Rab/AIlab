<!doctype html>
<html><head><meta charset="utf-8"><title>SAFETY › Risks</title>
<link rel="stylesheet" href="rd.css">
<style>
.main { gap: 12px; }
.shead { display: grid; grid-template-columns: 300px 300px minmax(0,1fr) 330px; gap: 12px; }
.tile { padding: 12px 16px; position: relative; display: flex; flex-direction: column; gap: 6px; }
.tile .tt { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; color: var(--text-2); letter-spacing: .02em; }
.big { font: 700 30px var(--mono); color: #fff; }
.big .u { font: 500 13px var(--sans); color: var(--text-2); margin-left: 6px; }
.sevbars { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.sevbars .r { display: grid; grid-template-columns: 70px 1fr 50px; gap: 8px; align-items: center; font-size: 12.5px; color: var(--text-2); }
.sevbars .r i { display: block; height: 8px; border-radius: 3px; background: var(--warn); }
.sevbars .r b { font: 600 12px var(--mono); color: #fff; text-align: right; }
.picker { display: flex; align-items: center; gap: 10px; }
.mpick { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); font-size: 14px; color: #fff; font-weight: 600; }
.mpick .t3 { font-weight: 500; }
.acts { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.th, .tr { display: grid; grid-template-columns: minmax(0,1fr) 230px 150px 170px 100px 220px; gap: 16px; align-items: center; padding: 0 18px; }
.th { font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); padding-top: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.th .op { color: var(--text-3); font-size: 13px; letter-spacing: 0; }
.tr { padding-top: 7px; padding-bottom: 7px; border-bottom: 1px solid rgba(36,48,65,.6); font-size: 13.5px; }
.tr .an { color: #fff; display: flex; align-items: center; gap: 8px; }
.grp { padding: 10px 18px 4px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
.cellb { display: flex; align-items: center; gap: 8px; }
.cellb .bt { position: relative; flex: 1; height: 10px; background: var(--bg-2); border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line); }
.cellb .bt i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.cellb .bt .rg { position: absolute; top: 4px; height: 2px; background: #fff; opacity: .8; }
.cellb .v { font: 600 12.5px var(--mono); color: #fff; min-width: 40px; text-align: right; }
.cellb .v.t3 { color: var(--text-3); }
.unk { font-size: 11.5px; font-weight: 700; color: var(--warn); border: 1px solid rgba(233,180,76,.5); border-radius: 6px; padding: 0 6px; }
.tr.top { background: rgba(239,107,107,.05); }
.tr.hero { background: rgba(58,138,224,.08); }
.foot { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--line); margin-top: auto; font-size: 13px; color: var(--text-2); }
.grp .link { text-transform: none; letter-spacing: 0; }
.shead .tile { overflow: visible; }
.rstrip { position: relative; height: 22px; margin: 2px 6px 0 0; border-bottom: 1px solid var(--line-2); }
.rstrip .band { position: absolute; top: 4px; height: 10px; border-radius: 4px; background: rgba(233,180,76,.35); box-shadow: inset 0 0 0 1px var(--warn); }
.rstrip .gt { position: absolute; top: 0; width: 2px; height: 18px; background: #fff; }
.rstrip .ax { position: absolute; bottom: -15px; transform: translateX(-50%); font: 10.5px var(--mono); color: var(--text-3); }
</style></head>
<body data-tab="safety">
<!--ICONS-->
<div class="app"><div class="main" id="main"></div></div>
<script src="data.js"></script>
<script src="comp.js"></script>
<script>if (location.hash === "#wide") { window.SHELL.loc = "Unknown"; }</script>
<script src="shell.js"></script>
<script src="safety.js"></script>
</body></html>
