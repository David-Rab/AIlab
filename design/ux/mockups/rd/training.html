<!doctype html>
<html><head><meta charset="utf-8"><title>TRAINING › Next run</title>
<link rel="stylesheet" href="rd.css">
<style>
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 700px; gap: 14px; flex: 1; min-height: 0; }
.pred { padding-bottom: 12px; display: flex; flex-direction: column; }
.pred .body { padding: 6px 18px 0; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--text-2); align-items: center; }
.legend i { display: inline-block; width: 16px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.ms { display: flex; align-items: center; gap: 10px; margin: 6px 18px 0; padding: 10px 14px; border-radius: 9px; background: rgba(155,107,224,.10); border: 1px solid rgba(155,107,224,.35); font-size: 14px; }
.ms b { color: #fff; }
.plan { display: flex; flex-direction: column; }
.stage { margin: 10px 14px 0; border: 1px solid var(--line); border-radius: 9px; background: var(--bg-2); }
.stage .sh { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 14.5px; font-weight: 650; color: #fff; }
.stage .sh .num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-3); font: 700 12px var(--mono); }
.opt { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 10px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.opt:last-child { border-bottom: 0; }
.opt .k { color: var(--text-3); }
.opt .v { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: #fff; }
.pill { padding: 2px 10px; border-radius: 7px; border: 1px solid var(--line-2); color: var(--text-2); font-size: 12.5px; }
.pill.on { background: #24364f; border-color: var(--you); color: #fff; font-weight: 600; }
.std { font-size: 11px; color: var(--text-3); margin-left: 2px; }
.limits { display: flex; align-items: stretch; gap: 0; }
.limits .lh { padding: 12px 18px; display: flex; flex-direction: column; justify-content: center; min-width: 150px; border-right: 1px solid var(--line); }
.lim1 { flex: 1; padding: 11px 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; }
.lim1 .t { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); }
.lim1 .val { font: 650 17px var(--mono); color: #fff; }
.lim1 .val .u { font: 500 12px var(--sans); color: var(--text-2); }
.lim1 .g { height: 6px; border-radius: 3px; background: var(--panel-3); position: relative; overflow: hidden; }
.lim1 .g i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--good); }
.lim1.short .g i { background: var(--warn); }
.lim1 .vd { font-size: 12px; font-weight: 650; }
.lim1 .vd.ok { color: var(--good); } .lim1 .vd.short { color: var(--warn); }
.launch { display: flex; align-items: center; padding: 0 20px; }
.launch .btn { font-size: 15px; padding: 10px 22px; }
.pushes { display: flex; gap: 8px; flex-wrap: wrap; }
.opt.opened { grid-template-columns: 150px minmax(0,1fr); }
.otab { grid-column: 1 / 3; margin: 6px 0 2px; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; }
.oh, .or { display: grid; grid-template-columns: minmax(0,1fr) 52px 70px 50px 70px 130px; gap: 8px; padding: 5px 10px; align-items: center; font-size: 12.5px; }
.oh { background: var(--panel-2); color: var(--text-3); font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
.or { border-top: 1px solid var(--line); color: var(--text); }
.or.on { background: rgba(58,138,224,.10); }
.up { color: var(--good); } .dn { color: var(--bad); }
.rup { color: var(--warn); font-weight: 600; } .rdn { color: var(--good); font-weight: 600; } .rup.sm { font-weight: 500; }
.pill.lk { color: var(--text-3); border-style: dashed; }
.sightrow { display: flex; align-items: center; gap: 10px; margin: 8px 18px 0; padding: 10px 14px; border-radius: 9px; background: var(--bg-2); border: 1px solid var(--line); font-size: 13.5px; color: var(--text-2); }
.pushrow { display: flex; align-items: center; gap: 12px; margin: 10px 14px 12px; padding: 9px 12px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); font-size: 13px; }
.sk { padding: 6px 0; }
.pred .sk { padding: 13px 0; }
.pred .skr { height: 24px; }
.rax { position: relative; height: 34px; border-top: 1px solid var(--line-2); }
.rax span { position: absolute; top: 4px; transform: translateX(-50%); font-size: 11.5px; color: var(--text-3); white-space: nowrap; padding-top: 6px; }
.rax span::before { content: ''; position: absolute; left: 50%; top: -5px; width: 1px; height: 8px; background: #5d6f88; }
.rax span.met { color: var(--good); }
</style></head>
<body data-tab="training">
<!--ICONS-->
<div class="app"><div class="main" id="main"></div></div>
<script src="data.js"></script>
<script src="comp.js"></script>
<script src="d2.js"></script>
<script src="shell.js"></script>
<script src="training.js"></script>
</body></html>
