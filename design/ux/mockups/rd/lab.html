<!doctype html>
<html><head><meta charset="utf-8"><title>LAB</title>
<link rel="stylesheet" href="rd.css">
<style>
.main { gap: 14px; }
/* allocation */
.alloc { padding-bottom: 14px; }
.alloc .hd { padding-bottom: 4px; }
.presets { display: flex; gap: 2px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.presets .p { padding: 4px 11px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.presets .p.on { background: var(--panel-3); color: #fff; }
.barwrap { position: relative; margin: 14px 16px 0; }
.bar { display: flex; gap: 2px; height: 46px; }
.bar .s { position: relative; height: 100%; border-radius: 4px; overflow: hidden; display: flex; }
.bar .s .used { height: 100%; }
.bar .s .idle { height: 100%; }
.bar .s .lbl { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font: 650 13px var(--mono); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; pointer-events: none; }
.bar .s.ai::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--ai); opacity: .9; }
.labels { position: relative; height: 44px; margin-top: 6px; }
.labels .lb { position: absolute; top: 0; font-size: 12.5px; color: var(--text-2); white-space: nowrap; line-height: 1.25; }
.labels .lb b { color: #fff; font-weight: 600; }
.labels .lb .n { color: var(--text-3); font-size: 11.5px; }
.labels .lb.r2 { top: 22px; }
.groups { display: flex; gap: 2px; margin: 0 16px; height: 18px; }
.groups .g { border-top: 2px solid; font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; padding-top: 2px; white-space: nowrap; overflow: hidden; }
.idlechip { display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 8px; border: 1px solid rgba(233,180,76,.45); background: var(--warn-bg); color: #f4d79a; font-size: 13px; }
.idlechip .sw { width: 22px; height: 14px; border-radius: 3px; background: #6b7c91; }
.idlechip b { font: 650 14px var(--mono); color: #fff; }

/* lower grid */
.lower { display: grid; grid-template-columns: minmax(0, 1fr) 520px; gap: 14px; flex: 1; min-height: 0; }
.board { display: flex; flex-direction: column; }
.wgrid { display: grid; grid-template-columns: 110px repeat(3, minmax(0,1fr)); grid-template-rows: auto 1fr auto; gap: 0; margin: 10px 16px 14px; flex: 1; min-height: 0; }
.colh { display: flex; align-items: center; gap: 8px; padding: 4px 14px 10px; font-size: 15px; font-weight: 650; color: #fff; }
.colh .ri { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--panel-3); color: var(--text-2); }
.band { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 10px 0 2px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.band .bt { display: flex; align-items: center; gap: 6px; }
.cell { border-left: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.cell.capb { border-top: 1px solid var(--line); }
.cell.safb { border-top: 1px dashed var(--line-2); }
.ppl { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--text-2); }
.ppl b { font: 650 18px var(--mono); color: #fff; }
.qp { display: inline-flex; gap: 2px; vertical-align: 1px; } .qp i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); } .qp i.on { background: #d9c27a; }
.effort .top2 { display: flex; align-items: baseline; justify-content: space-between; font-size: 12.5px; color: var(--text-3); margin-bottom: 4px; }
.effort .top2 b { font: 650 20px var(--mono); color: #fff; }
.ebar { position: relative; height: 16px; background: var(--bg-2); border-radius: 4px; display: flex; gap: 2px; }
.ebar .hp { background: var(--human); border-radius: 4px 0 0 4px; }
.ebar .ap { background: var(--ai); border-radius: 0 4px 4px 0; }
.aistaff { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); margin-top: 5px; flex-wrap: wrap; }
.mchip { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border-radius: 6px; background: #13232a; border: 1px solid #22504b; color: var(--ai); font-size: 12px; font-weight: 600; }
.needs { display: flex; flex-direction: column; gap: 6px; }
.needs .cap { font-size: 10.5px; }
.nd { display: grid; grid-template-columns: minmax(0,1fr) 92px 54px; align-items: center; gap: 8px; font-size: 13px; }
.nd .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.nd .gb { position: relative; height: 8px; border-radius: 4px; background: var(--bg-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.nd .gb i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: #6f8fb5; }
.nd.short .gb i { background: var(--warn); }
.nd .st { font: 600 12px var(--mono); text-align: right; color: var(--text-3); }
.nd.short .st { color: var(--warn); }
.nd.spare .nm { color: var(--text-3); }
.nd.spare .gb i { background: repeating-linear-gradient(135deg, #56677e 0 3px, transparent 3px 6px); }
.split { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line-2); font-size: 12.5px; color: var(--text-2); }
.split .hbar { flex: 1; height: 12px; border-radius: 3px; display: flex; gap: 2px; }
.footlinks { display: flex; gap: 8px; padding: 0 16px 12px; align-items: center; color: var(--text-3); font-size: 12.5px; }

/* best moves */
.moves { display: flex; flex-direction: column; }
.mv { display: grid; grid-template-columns: 26px 22px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line); }
.mv:first-of-type { border-top: 0; }
.mv .rk { font: 700 13px var(--mono); color: var(--text-3); text-align: center; }
.mv .what { font-size: 14px; color: #fff; font-weight: 600; }
.mv .eff { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 13px; color: var(--text-2); }
.mv .eff .gbar { height: 8px; border-radius: 4px; background: var(--good); }
.mv .eff b { font-family: var(--mono); color: var(--good); }
.mv .cost { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.mv.top { background: rgba(58,138,224,.07); }

.bar { height: 58px; }
.bar .s .lbl2 { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; line-height: 1.25; white-space: nowrap; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
.bar .s .lbl2 b { color: #fff; font-size: 13.5px; font-weight: 650; }
.bar .s .lbl2 span { color: #eef2f8; font: 600 12.5px var(--mono); }
.bar .s .lbl2 .idw { color: #ffe3a6; font-family: var(--sans); }
.bar .s.empty, .lbar .s.empty { box-shadow: inset 0 0 0 1.5px #5d6f88; border-radius: 4px; background: transparent; }
.clu { display: flex; gap: 1px; height: 100%; outline: 1.5px dashed #8da2bd; outline-offset: 2px; border-radius: 3px; }
.clu .s { border-radius: 1px; min-width: 2px; }
.groups { position: relative; height: 20px; margin: 6px 0 0; display: block; }
.groups .g { position: absolute; top: 0; border-top: 2px solid; font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; padding-top: 2px; white-space: nowrap; }
.lensln { position: absolute; left: 0; top: 0; pointer-events: none; }
.lens { margin: 30px 0 0 auto; width: 860px; margin-right: 300px; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 10px 12px 8px; }
.lbar { display: flex; gap: 2px; height: 26px; }
.lbar .s { position: relative; border-radius: 3px; overflow: hidden; display: flex; }
.lbar .s.ai::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--ai); }
.llab { display: flex; gap: 2px; margin-top: 5px; }
.llab > div { display: flex; flex-direction: column; font-size: 12px; color: #fff; white-space: nowrap; line-height: 1.3; min-width: 0; }
.llab .n { color: var(--text-2); font-size: 11.5px; }
.llab .zero { color: var(--warn); }
.wont { margin-top: auto; padding: 12px 16px 14px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.sparesw { width: 14px; height: 8px; border-radius: 2px; background: repeating-linear-gradient(135deg, #8295ad 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px #56677e; }
.nd.nil .nm, .nd.nil .st { color: var(--text-3); }
.wgrid { grid-template-rows: auto auto auto auto !important; align-content: start; }
.scrim2 { position: absolute; inset: 0; background: rgba(5,8,12,.45); z-index: 40; }
.glegend { display: flex; gap: 14px; margin-left: 14px; font-size: 13px; color: var(--text-2); }
.glegend span { display: inline-flex; align-items: center; gap: 6px; }
.glegend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.glegend b { color: #fff; }
.lgrp { height: 18px; font-size: 11.5px; font-weight: 650; color: var(--ai); letter-spacing: .04em; }
.lgrp div { border-bottom: 1.5px solid rgba(127,224,207,.5); padding-bottom: 1px; margin-bottom: 4px; display: flex; gap: 4px; align-items: center; }
.mv .eff .pre { margin-left: 6px; padding: 0 7px; border-radius: 6px; background: rgba(76,195,138,.12); font: 600 12.5px var(--mono); color: #bff0d6; }
.nd { grid-template-columns: minmax(0,1fr) 92px 66px !important; }
.wont { margin-top: 0 !important; }
.moves .fill { flex: 1; }
.bar .s .lbl2 { background: rgba(11,15,21,.55); padding: 3px 8px; border-radius: 5px; left: 6px; }
.mchip2 { font-size: 11.5px; color: var(--ai); margin-left: 4px; }
.tip .brk > span:nth-child(odd) { display: flex; align-items: center; gap: 6px; }
</style></head>
<body data-tab="lab">
<!--ICONS-->
<div class="app">
  <div class="main" id="main"></div>
</div>
<script src="data.js"></script>
<script src="shell.js"></script>
<script src="tip.js"></script>
<script src="lab.js"></script>
</body></html>
