<!doctype html>
<html><head><meta charset="utf-8"><title>TRAINING › Runs</title>
<link rel="stylesheet" href="rd.css">
<style>
.main { gap: 14px; }
.gantt { padding-bottom: 12px; }
.gt { position: relative; margin: 10px 20px 0 150px; }
.lane { position: relative; height: 84px; border-bottom: 1px solid var(--line); }
.lane .ln { position: absolute; left: -150px; top: 0; bottom: 0; width: 140px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #fff; font-weight: 600; }
.lane .ln svg { color: var(--text-2); }
.bar { position: absolute; top: 30px; height: 22px; border-radius: 4px; }
.bar.pre { background: #6d55a8; } .bar.post { background: var(--cap); } .bar.dis { background: #b79ae8; } .bar.ev { background: #4f6d8f; }
.bar.run { background: repeating-linear-gradient(135deg, rgba(155,107,224,.55) 0 5px, rgba(155,107,224,.22) 5px 10px); box-shadow: inset 0 0 0 1px #c4a5f5; }
.bar.run .done { position: absolute; left: 0; top: 0; bottom: 0; background: #6d55a8; border-radius: 4px 0 0 4px; }
.bar.evr { background: repeating-linear-gradient(135deg, rgba(111,143,181,.6) 0 5px, rgba(111,143,181,.25) 5px 10px); box-shadow: inset 0 0 0 1px #8fb0d6; }
.res { position: absolute; top: 8px; font-size: 11.5px; color: var(--text-2); white-space: nowrap; transform: translateX(-50%); }
.res.l { transform: none; }
.res b { color: #fff; font-weight: 600; }
.res.mini { color: var(--text-3); }
.xa { position: relative; height: 30px; }
.xa span { position: absolute; top: 6px; transform: translateX(-50%); font: 11.5px var(--mono); color: var(--text-3); white-space: nowrap; }
.today { position: absolute; top: -6px; bottom: 0; width: 2px; background: var(--you); z-index: 3; }
.today span { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font: 700 11px var(--mono); color: #cfe3ff; background: #1f3552; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.grid { display: grid; grid-template-columns: minmax(0,1fr) 560px; gap: 14px; flex: 1; min-height: 0; }
.fc { padding: 0 20px; }
.fr { display: grid; grid-template-columns: 250px minmax(0,1fr) 150px; gap: 18px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.fr:last-child { border-bottom: 0; }
.fr .nm b { display: block; color: #fff; font-size: 14.5px; }
.fr .nm span { font-size: 12px; color: var(--text-3); }
.rl { position: relative; height: 26px; background: var(--bg-2); border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line); }
.rl .tk { position: absolute; top: -5px; bottom: -5px; width: 2px; }
.rl .tk.med { background: #8da2bd; } .rl .tk.best { background: #fff; }
.rl .band { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; background: repeating-linear-gradient(135deg, rgba(155,107,224,.6) 0 4px, rgba(155,107,224,.2) 4px 8px); box-shadow: inset 0 0 0 1px #c4a5f5; }
.rl .dot { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: #fff; transform: translate(-7px, -7px); box-shadow: 0 0 0 2px var(--panel); }
.rl .wh { position: absolute; top: 50%; height: 2px; background: #fff; transform: translateY(-1px); }
.rl .ref { position: absolute; top: 3px; bottom: 3px; width: 3px; background: var(--text-3); border-radius: 2px; }
.rh { position: relative; height: 18px; }
.rh span { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--text-3); white-space: nowrap; }
.verd { font-size: 13px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--text-2); align-items: center; flex-wrap: wrap; }
.legend i { display: inline-block; width: 16px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.now { display: flex; flex-direction: column; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 9px 12px; padding: 14px 20px; font-size: 13.5px; }
.kv .k { color: var(--text-3); }
.kv .v { color: #fff; }
.prog { margin: 12px 20px 0; }
.prog .pb { position: relative; height: 14px; border-radius: 4px; background: var(--bg-2); box-shadow: inset 0 0 0 1px var(--line-2); overflow: hidden; }
.prog .pb i { position: absolute; left: 0; top: 0; bottom: 0; background: #6d55a8; }
.big { font: 650 26px var(--mono); color: #fff; } .big .u { font: 500 13px var(--sans); color: var(--text-2); margin-left: 4px; }
.strip { display: flex; align-items: center; gap: 12px; margin: 12px 20px 0 150px; font-size: 13px; color: var(--text-2); }
.strip .sb { flex: 0 0 420px; display: flex; gap: 2px; height: 10px; }
.strip .sb i { height: 100%; border-radius: 3px; }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 640px; background: #111821; border-left: 1px solid #3a4c66; box-shadow: -18px 0 40px rgba(0,0,0,.55); z-index: 50; display: flex; flex-direction: column; }
.scrim { position: absolute; inset: 0; background: rgba(5,8,12,.55); z-index: 40; }
.drawer .dh { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); font-size: 17px; font-weight: 650; color: #fff; }
.drawer .sec { padding: 14px 20px; border-bottom: 1px solid var(--line); }
.snap { display: grid; grid-template-columns: 150px 1fr; gap: 7px 12px; font-size: 13px; }
.snap .k { color: var(--text-3); }
</style></head>
