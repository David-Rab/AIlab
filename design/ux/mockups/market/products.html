<!doctype html>
<html><head><meta charset="utf-8"><title>PRODUCTS</title>
<link rel="stylesheet" href="../rd/rd.css">
<style>
/* totals strip (L1 #1) */
.strip { display: grid; grid-template-columns: 340px minmax(0,1fr) minmax(0,1fr); }
.strip .blk { padding: 14px 22px; display: flex; flex-direction: column; gap: 7px; border-right: 1px solid var(--line); justify-content: center; }
.strip .blk:last-child { border-right: 0; }
.strip .big { font: 700 34px var(--mono); color: #fff; line-height: 1.1; }
.strip .big .u { font: 500 14px var(--sans); color: var(--text-2); margin-left: 4px; }
.cbar { position: relative; height: 10px; border-radius: 4px; background-color: rgba(176,142,26,.22); background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0) 0 4px, rgba(11,15,21,.55) 4px 7px); }
.cbar.big2 { height: 14px; }
.cbar i { position: absolute; left: 0; top: 0; bottom: 0; background: #7f96b3; border-radius: 4px; }
.trk { position: relative; height: 34px; }
.trk .ax { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--panel-3); border-radius: 1px; }
.trk .now { position: absolute; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--you); transform: translateX(-8px); box-shadow: 0 0 0 2px var(--panel); }
.trk .tgt { position: absolute; top: 3px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #cfe3ff; transform: translateX(-8px); background: var(--panel); }
.trk .arr { position: absolute; top: 10px; height: 2px; background: repeating-linear-gradient(90deg, #ef6b6b 0 6px, transparent 6px 10px); }
.trk .rv { position: absolute; top: 2px; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 10px solid var(--rival); transform: translateX(-6px); }
.trk .tl2 { position: absolute; top: 19px; transform: translateX(-50%); font: 11px var(--mono); color: var(--text-3); }
.dn { color: var(--bad); }

/* product cards (L1 #2) */
.cards { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; flex: 1; min-height: 0; }
.pcard { display: flex; flex-direction: column; padding: 14px 18px 12px; gap: 15px; min-width: 0; }
.pcard.focus { box-shadow: 0 0 0 2px var(--you); }
.ph2 { display: flex; align-items: center; gap: 11px; }
.ph2 .pi { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: rgba(176,142,26,.16); color: #e2c45a; flex-shrink: 0; }
.ph2 .pn { font-size: 18px; font-weight: 650; color: #fff; line-height: 1.2; }
.ph2 .who { font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph2 .who svg { color: var(--text-3); }
.pf { display: flex; flex-direction: column; gap: 6px; }
.pbig { font: 700 32px var(--mono); color: #fff; line-height: 1.1; }
.pbig .u { font: 500 13.5px var(--sans); color: var(--text-2); margin-left: 3px; }
.rbar { position: relative; height: 12px; background: var(--bg-2); border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line); }
.rbar i { position: absolute; top: 0; bottom: 0; }
.rbar i.pr { left: 0; background: var(--prod); border-radius: 4px 0 0 4px; }
.rbar i.co { background: #56677e; border-radius: 0 4px 4px 0; }
.rlbl { display: flex; gap: 16px; font-size: 12.5px; color: var(--text-3); }
.rlbl .sw { display: inline-block; width: 10px; height: 8px; border-radius: 2px; margin-right: 5px; }
.rlbl .sw.pr { background: var(--prod); } .rlbl .sw.co { background: #56677e; }
.kv3 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kv3 > div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; }
.kv3 .k { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); font-weight: 650; }
.kv3 .v { font: 650 19px var(--mono); color: #fff; }
.kv3 .s { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec2 { display: flex; flex-direction: column; gap: 7px; }
.sec2 .sh { display: flex; align-items: center; gap: 8px; }
.away { font-size: 13px; color: var(--warn); display: flex; gap: 6px; align-items: center; }
.away .n { font-weight: 650; }
.setrow { display: flex; gap: 12px; align-items: center; font-size: 13px; }
.setrow .k { color: var(--text-3); }
.seg3 { display: inline-flex; gap: 2px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg3 span { padding: 3px 11px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--text-2); display: inline-flex; gap: 5px; align-items: center; }
.seg3 span.on { background: var(--panel-3); color: #fff; box-shadow: inset 0 0 0 1px var(--line-2); }

.lu { display: grid; grid-template-columns: 20px minmax(0,1fr) 64px 118px; gap: 9px; align-items: center; font-size: 13.5px; padding: 3px 4px; border-radius: 6px; }
.lu.row-m { cursor: pointer; }
.lu.sel { background: #1b2a40; box-shadow: inset 0 0 0 1px var(--you); }
.lu.dead .mn { color: var(--text-2); font-weight: 500; }
.lu .mn { color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lu .mtag { font: 600 10.5px var(--sans); color: var(--text-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; margin-left: 4px; vertical-align: 1px; }
.lu .sk, .po .sk { display: block; padding: 0; height: 6px; background: var(--panel-3); border-radius: 3px; position: relative; }
.lu .sk i, .po .sk i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cap); border-radius: 3px; }
.lu .hb { height: 10px; background: var(--panel-3); border-radius: 3px; position: relative; }
.lu .hb i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--prod); border-radius: 3px; }
.lu .pc { font: 600 12.5px var(--mono); color: var(--text-2); text-align: right; width: 34px; }
.lu.hd2 { font-size: 11px; color: var(--text-3); letter-spacing: .05em; text-transform: uppercase; font-weight: 650; padding: 0 4px; }
.lu .ro { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font: 700 10.5px var(--mono); color: var(--text-3); border: 1px solid var(--line-2); }
.addm { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--text-2); padding: 4px 6px; border: 1px dashed var(--line-2); border-radius: 6px; }
.addm .t3 { font-size: 12px; }

.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.tool { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 7px; background: var(--panel-2); border: 1px solid var(--line-2); font-size: 13px; color: #fff; white-space: nowrap; }
.tool > svg { color: #e2c45a; }
.tool .cert { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--good); margin-left: 2px; }
.tool.add { color: var(--text-2); border-style: dashed; background: transparent; }
.tool.add > svg { color: var(--text-2); }
.tool.add .t3 { font-size: 12px; }
.pfoot { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--line); }

/* lineup swap popover */
.pop { position: absolute; z-index: 50; width: 690px; background: #0f151d; border: 1px solid #3a4c66; border-radius: 10px; box-shadow: 0 16px 44px rgba(0,0,0,.65); padding: 10px 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.pop .phd { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 2px 2px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.po { display: grid; grid-template-columns: minmax(0,1fr) 70px 104px 72px 86px 96px; gap: 10px; align-items: center; font-size: 13.5px; padding: 7px 6px; border-radius: 6px; }
.po .n { text-align: right; font-weight: 600; }
.po .mn { color: #fff; font-weight: 600; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.po .sk b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; }
.po.hd3 { font-size: 11px; color: var(--text-3); letter-spacing: .05em; text-transform: uppercase; font-weight: 650; padding: 2px 6px; }
.po.hd3 > span:nth-child(n+3) { text-align: right; }
.po:not(.hd3):not(.rm):first-of-type { }
.po.hov { background: var(--panel-2); }
.pnote { font-size: 12px; color: var(--good); padding: 0 6px 4px; margin-top: -4px; display: flex; gap: 5px; align-items: center; }
.po.rm { border-top: 1px solid var(--line); border-radius: 0; margin-top: 4px; padding-top: 9px; }
.po.rm .mn { color: var(--bad); font-weight: 600; }
.pop::after { content: ""; position: absolute; right: -8px; top: 66px; width: 14px; height: 14px; background: #0f151d; border-right: 1px solid #3a4c66; border-top: 1px solid #3a4c66; transform: rotate(45deg); }
</style></head>
<body data-tab="products">
<!--ICONS-->
<div class="app"><div class="main" id="main"></div></div>
<script src="data.js"></script>
<script src="../rd/shell.js"></script>
<script src="products.js"></script>
</body></html>
