<!doctype html>
<html><head><meta charset="utf-8"><title>COMPUTE · Sites</title>
<link rel="stylesheet" href="../rd/rd.css">
<style>
:root { --perm: #8da2bd; --cons: #5b84c4; --pow: #d9a53a; --live: #4cc38a; }
.cols { display: grid; grid-template-columns: minmax(0,1fr) 680px; gap: 16px; flex: 1; min-height: 0; }
.card { display: flex; flex-direction: column; min-height: 0; }
.cbody { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.lbl { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); font-weight: 650; display: flex; align-items: center; gap: 8px; }
.lbl .t3 { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12.5px; }

/* ── sites (left) ── */
.srow { display: grid; grid-template-columns: 170px 64px minmax(0,1fr) 62px 262px; gap: 12px; align-items: center; }
.srow.hd2 { font-size: 11px; color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; font-weight: 650; }
.srow.site { padding: 15px 0; border-top: 1px solid var(--line); }
.sname { display: flex; align-items: center; gap: 9px; min-width: 0; }
.sname .si { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--text-2); flex-shrink: 0; }
.sname .nm { color: #fff; font-weight: 600; font-size: 14.5px; white-space: nowrap; }
.sname .ssrc { font-size: 12px; color: var(--text-3); }
.gw { font: 650 15px var(--mono); color: #fff; text-align: right; }
.trk2 { position: relative; height: 38px; }
.trk2 .ln { position: absolute; height: 14px; border-radius: 3px; }
.trk2 .ln.top { top: 3px; } .trk2 .ln.bot { top: 21px; } .trk2 .ln.full { top: 3px; height: 32px; }
.trk2 .plan { background-image: repeating-linear-gradient(135deg, rgba(11,15,21,0) 0 4px, rgba(11,15,21,.8) 4px 8px); opacity: .85; }
.trk2 .wait { background: transparent !important; border: 1px dashed rgba(217,165,58,.55); }
.trk2 .now { position: absolute; top: -9px; bottom: -9px; width: 2px; background: rgba(255,255,255,.55); }
.trk2 .dia { position: absolute; top: 11px; width: 16px; height: 16px; transform: translateX(-8px) rotate(45deg); background: var(--live); border: 2px solid var(--panel); border-radius: 2px; }
.trk2 .dia.risk { background: var(--panel); border: 2px solid var(--live); }
.trk2 .roll { position: absolute; top: -2px; transform: translateX(-50%); color: var(--warn); }
.ldate { font: 650 15px var(--mono); color: #fff; }
.ldate.live { color: var(--live); font-family: var(--sans); font-weight: 650; }
.stg { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.stg .sub { color: var(--text-3); font-size: 12.5px; }
.axis2 { position: relative; height: 18px; }
.axis2 span { position: absolute; transform: translateX(-50%); font: 12px var(--mono); color: var(--text-3); }
.axis2 span.today { color: #fff; font-family: var(--sans); font-weight: 650; }
.capc { position: relative; height: 240px; }
.capc svg { position: absolute; inset: 0; overflow: visible; }
.yax { font: 11.5px var(--mono); color: var(--text-3); text-align: right; display: flex; flex-direction: column; justify-content: space-between; height: 240px; padding: 0 2px 0 0; }
.leg { display: flex; gap: 18px; font-size: 12.5px; color: var(--text-2); align-items: center; padding-top: 6px; }
.leg i { display: inline-block; width: 18px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.capsum { display: flex; flex-direction: column; gap: 6px; }
.capsum .big { font: 700 28px var(--mono); color: #fff; line-height: 1; }
.capsum .big .u { font: 500 13px var(--sans); color: var(--text-2); margin-left: 4px; }
.ubar { height: 8px; background: var(--panel-3); border-radius: 4px; position: relative; width: 170px; }
.ubar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--live); border-radius: 4px; }

/* ── build card (right) ── */
.tiles5 { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; }
.tl { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 8px 7px; display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative; }
.tl.on { border-color: var(--you); background: #182a42; box-shadow: inset 0 0 0 1px var(--you); }
.tl .a { font-size: 13px; font-weight: 650; color: #fff; white-space: nowrap; }
.tl .b { font: 600 13px var(--mono); color: var(--text-2); }
.tl .c { font-size: 11.5px; color: var(--text-3); }
.tl .gtag { position: absolute; top: -7px; right: 6px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; color: #e9a35a; padding: 0 5px; font-size: 10.5px; display: flex; gap: 3px; align-items: center; }
.tiles3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.src { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 9px; padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 8px; position: relative; }
.src.on { border-color: var(--you); background: #182a42; box-shadow: inset 0 0 0 1px var(--you); }
.src .sh { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 650; color: #fff; }
.src .sh svg { color: var(--text-2); }
.src .wt { display: flex; align-items: baseline; gap: 6px; }
.src .wt .n { font: 700 24px var(--mono); color: #fff; }
.src .wt .k { font-size: 12px; color: var(--text-3); }
.wbar { height: 6px; background: var(--bg-2); border-radius: 3px; position: relative; box-shadow: inset 0 0 0 1px var(--line); }
.wbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--pow); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; font-size: 13px; }
.kv .k { color: var(--text-3); }
.kv .v { font-family: var(--mono); color: var(--text); text-align: right; font-weight: 600; }
.kv .v.best { color: var(--good); }
.pips3 { display: inline-flex; gap: 3px; vertical-align: 1px; } .pips3 i { width: 11px; height: 7px; border-radius: 2px; background: var(--line-2); }
.pips3.l1 i:nth-child(-n+1) { background: var(--warn); } .pips3.l2 i:nth-child(-n+2) { background: var(--warn); } .pips3.l3 i { background: var(--bad); }
.lev { display: grid; grid-template-columns: 34px minmax(0,1fr) 128px 74px; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); }
.lev.on { border-color: rgba(58,138,224,.6); background: #13223a; }
.tg { width: 30px; height: 17px; border-radius: 9px; background: var(--panel-3); position: relative; border: 1px solid var(--line-2); }
.tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--text-3); }
.lev.on .tg { background: #1f5fae; border-color: #3a8ae0; } .lev.on .tg::after { left: 15px; background: #fff; }
.lev .ln2 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lev .ln2 .nm { color: #fff; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.lev .ln2 .sb { color: var(--text-3); font-size: 12px; white-space: nowrap; }
.lev .ln2 svg { color: var(--text-2); }
.lev .sv { font: 650 13px var(--mono); color: var(--good); text-align: right; white-space: nowrap; }
.lev .sv.zero { color: var(--text-3); }
.lev .pr { font: 600 13px var(--mono); color: var(--text-2); text-align: right; }
.lev .side { color: var(--bad); font-size: 11.5px; margin-left: 4px; }
.pvw { background: var(--bg-2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.pvl { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 10px; align-items: center; font-size: 12.5px; color: var(--text-2); }
.pvl .tk { position: relative; height: 14px; }
.pvl .tk i { position: absolute; top: 1px; height: 12px; border-radius: 3px; }
.pvl .tk .bind { position: absolute; top: -1px; font-size: 11px; color: #fff; font-weight: 650; padding-left: 6px; white-space: nowrap; }
.pvl .tk .rdy { position: absolute; top: 0; font-size: 11.5px; color: var(--text-3); white-space: nowrap; padding-left: 6px; }
.pvlive { position: relative; height: 44px; }
.pvl .tk::before, .pvlive::before { content: ""; position: absolute; left: 9.09%; top: -6px; bottom: -6px; border-left: 1px solid rgba(255,255,255,.08); }
.pvlive .dia { position: absolute; top: 6px; width: 18px; height: 18px; transform: translateX(-9px) rotate(45deg); background: var(--live); border-radius: 2px; }
.pvlive .dia.gh { background: transparent; border: 2px dashed var(--text-3); width: 14px; height: 14px; top: 8px; transform: translateX(-7px) rotate(45deg); }
.pvlive .lb { position: absolute; top: 2px; white-space: nowrap; }
.pvlive .lb.main { font: 700 20px var(--mono); color: var(--live); }
.pvlive .lb.main .u { white-space: nowrap; font: 500 12.5px var(--sans); color: var(--text-2); margin-left: 6px; }
.pvlive .lb.gh { font-size: 12px; color: var(--text-3); top: 26px; transform: translateX(-50%); }
.pvax { position: relative; height: 14px; }
.pvax span { position: absolute; transform: translateX(-50%); font: 11.5px var(--mono); color: var(--text-3); }
.pvline { position: absolute; top: -132px; bottom: 16px; width: 0; border-left: 1px dashed rgba(76,195,138,.55); }
.tot { display: grid; grid-template-columns: 1fr 1fr 1fr 1.35fr; gap: 8px; }
.tot > div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; }
.tot .k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); font-weight: 650; }
.tot .v { font: 700 19px var(--mono); color: #fff; white-space: nowrap; }
.tot .v .u { font: 500 12px var(--sans); color: var(--text-2); margin-left: 2px; }
.tot .s { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.foot { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: auto; }
.payc { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
.payc b { color: #fff; }
.btn.big { padding: 9px 18px; font-size: 14px; }

/* tooltips */
.tip .spk { display: block; margin: 4px 0 2px; }
.tip .spkax { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--text-3); margin-bottom: 8px; }
.tip .sub2 { color: var(--text-3); font-size: 12px; }
.hov { box-shadow: 0 0 0 2px #8fbfff !important; border-radius: 6px; }
</style></head>
<body data-tab="compute">
<!--ICONS-->
<div class="app"><div class="main" id="main"></div></div>
<script src="data.js"></script>
<script src="../rd/shell.js"></script>
<script src="build.js"></script>
</body></html>
