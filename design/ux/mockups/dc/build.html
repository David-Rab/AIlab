<!doctype html>
<html><head><meta charset="utf-8"><title>COMPUTE · Overview</title>
<link rel="stylesheet" href="../rd/rd.css">
<style>
:root { --perm: #8da2bd; --cons: #5b84c4; --pow: #d9a53a; --live: #4cc38a; --run: #3a8ae0; --cloudc: #6b7c91; }
.main { gap: 12px; padding-top: 14px; }
.ph .lk { margin-left: auto; display: flex; gap: 8px; }
.ph .lk span { font-size: 12.5px; color: var(--text-2); border: 1px dashed var(--line-2); border-radius: 6px; padding: 2px 8px; }
.cols { display: grid; grid-template-columns: minmax(0,1fr) 450px; gap: 12px; flex: 1; min-height: 0; }
.lcol, .rcol { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.card { display: flex; flex-direction: column; }
.cb { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 9px; }
.hd .rt { margin-left: auto; font-size: 12.5px; color: var(--text-3); }
.hd .rt b { font-family: var(--mono); color: var(--text-2); }

/* status strip (unchanged) */
.status { display: grid; grid-template-columns: 1.15fr 1.15fr 0.9fr; gap: 12px; }
.cst { display: flex; align-items: center; gap: 12px; padding: 9px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.cst .ci { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; }
.cst.good .ci { background: var(--good-bg); color: var(--good); } .cst.warn .ci { background: var(--warn-bg); color: var(--warn); }
.cst .a { color: #fff; font-size: 14px; } .cst .a b { font: 700 17px var(--mono); margin-right: 4px; }
.cst .b { color: var(--text-3); font-size: 12.5px; } .cst .b b { color: var(--text-2); }
.cst > svg:last-child { margin-left: auto; color: var(--text-3); }

/* chart (unchanged) */
.chartc { flex: 1; min-height: 0; }
.chart { position: relative; flex: 1; min-height: 0; margin: 2px 14px 10px; }
.chart svg { position: absolute; inset: 0; overflow: visible; }
.lg { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-2); margin-left: auto; align-items: center; }
.lg i { display: inline-block; width: 14px; height: 3px; margin-right: 5px; vertical-align: 3px; border-radius: 1px; }

/* site rows (moved from Sites) */
.srow { display: grid; grid-template-columns: 168px 62px minmax(0,1fr) 58px 286px; gap: 12px; align-items: center; }
.srow.site { padding: 4px 0; border-top: 1px solid var(--line); }
.sname { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
.sname svg { color: var(--text-2); }
.sname .nm { color: #fff; font-weight: 600; font-size: 13.5px; }
.sname .ssrc { font-size: 12px; color: var(--text-3); }
.gw { font: 650 13.5px var(--mono); color: #fff; text-align: right; }
.trk2 { position: relative; height: 24px; }
.trk2 .ln { position: absolute; height: 9px; border-radius: 2px; }
.trk2 .ln.top { top: 2px; } .trk2 .ln.bot { top: 13px; } .trk2 .ln.full { top: 2px; height: 20px; }
.trk2 .plan { background-image: repeating-linear-gradient(135deg, rgba(11,15,21,0) 0 4px, rgba(11,15,21,.8) 4px 8px); opacity: .85; }
.trk2 .now { position: absolute; top: -5px; bottom: -5px; width: 2px; background: rgba(255,255,255,.5); }
.trk2 .dia { position: absolute; top: 5px; width: 13px; height: 13px; transform: translateX(-6px) rotate(45deg); background: var(--live); border: 2px solid var(--panel); border-radius: 2px; }
.trk2 .dia.risk { background: var(--panel); border: 2px solid var(--live); }
.trk2 .roll { position: absolute; top: -4px; transform: translateX(-50%); color: var(--warn); }
.ldate { font: 650 13.5px var(--mono); color: #fff; }
.stg { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.stg .sub { color: var(--text-3); }
.axis2 { position: relative; height: 15px; }
.axis2 span { position: absolute; transform: translateX(-50%); font: 11.5px var(--mono); color: var(--text-3); }
.axis2 span.today { color: #fff; font-family: var(--sans); font-weight: 650; }
.leg { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); align-items: center; }
.leg i { display: inline-block; width: 14px; height: 8px; border-radius: 2px; margin-right: 5px; }

/* right-column cards (current kit look) */
.tiles { display: grid; gap: 6px; }
.tiles.c5 { grid-template-columns: repeat(5, minmax(0,1fr)); } .tiles.c3 { grid-template-columns: repeat(3, minmax(0,1fr)); } .tiles.c2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.tl { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 7px; padding: 5px 4px; display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 0; }
.tl.on { border-color: var(--you); background: #182a42; box-shadow: inset 0 0 0 1px var(--you); }
.tl.lock { opacity: .45; }
.tl .a { font-size: 12.5px; font-weight: 650; color: #fff; white-space: nowrap; display: flex; gap: 5px; align-items: center; }
.tl .a svg { color: var(--text-2); }
.tl .b { font: 600 12px var(--mono); color: var(--text-2); white-space: nowrap; }
.tl .b .wq { color: #fff; }
.lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); font-weight: 650; }
.pills { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12.5px; color: var(--text-2); }
.pl { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 6px; font: 600 12px var(--mono); border: 1px solid transparent; white-space: nowrap; }
.pl.cost { color: #ffb4b4; background: var(--bad-bg); border-color: rgba(239,107,107,.3); }
.pl.gain { color: #9ff0c8; background: var(--good-bg); border-color: rgba(76,195,138,.3); }
.pl.exp { color: #ffe0a0; background: var(--warn-bg); border-color: rgba(233,180,76,.35); }
.pvl2 { font-size: 12.5px; color: var(--text-2); }
.pvl2 b { color: #fff; font-family: var(--mono); }
.foot2 { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 12.5px; }
.foot2 .more { display: flex; align-items: center; gap: 5px; color: var(--text-2); }
.foot2 .more b { color: #fff; }
.seg3 { display: inline-flex; gap: 2px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 7px; padding: 2px; }
.seg3 span { padding: 1px 8px; border-radius: 5px; font-size: 12px; color: var(--text-2); }
.seg3 span.on { background: var(--panel-3); color: #fff; }
.paytl .b { font-size: 11.5px; } .paytl .b.g { color: var(--good); }
.opts { display: flex; flex-direction: column; gap: 4px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
.opt { display: grid; grid-template-columns: 28px minmax(0,1fr) auto 58px; gap: 8px; align-items: center; font-size: 12.5px; }
.tg { width: 26px; height: 15px; border-radius: 8px; background: var(--panel-3); position: relative; border: 1px solid var(--line-2); }
.tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 9px; height: 9px; border-radius: 50%; background: var(--text-3); }
.opt.on .tg { background: #1f5fae; border-color: #3a8ae0; } .opt.on .tg::after { left: 13px; background: #fff; }
.opt .nm { color: #fff; white-space: nowrap; }
.opt .sv { font: 650 12px var(--mono); color: var(--good); text-align: right; white-space: nowrap; }
.opt .pr { font: 600 12px var(--mono); color: var(--text-2); text-align: right; }
.opt .side { color: var(--bad); font-size: 11px; margin-left: 3px; font-family: var(--sans); }

.tip .spk { display: block; margin: 4px 0 2px; }
.tip .spkax { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--text-3); margin-bottom: 8px; }
.tip .sub2 { color: var(--text-3); font-size: 12px; }
.hov { box-shadow: 0 0 0 2px #8fbfff !important; border-radius: 6px; }
</style></head>
<body data-tab="compute">
<!--ICONS-->
<div class="app"><div class="main" id="main"></div></div>
<script src="data.js"></script>
<script src="../rd/shell.js"></script>
<script src="build.js"></script>
</body></html>
